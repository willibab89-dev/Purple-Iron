name: "Dratini, Mewtwo and Mew redesigns"

on:
  workflow_dispatch:
  push:
    branches: [master, main, audio_dev, custom-front-sprites, unique-species]
  pull_request:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex pkg-config libpng-dev python3
      - name: Build pinned tools and verified original ROMs
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            git init "$2"
            git -C "$2" remote add origin "https://github.com/$1.git"
            git -C "$2" fetch --depth 1 origin "$3"
            git -C "$2" checkout --detach FETCH_HEAD
            test "$(git -C "$2" rev-parse HEAD)" = "$3"
          }
          fetch gbdev/rgbds "$RUNNER_TEMP/rgbds-old" 193cc06561775b9eaa5d63d19ffed8cdec9cb3d8
          make -C "$RUNNER_TEMP/rgbds-old" -j2 YACC=bison CFLAGS='-O2 -fcommon' WARNFLAGS=-Wall PREFIX="$RUNNER_TEMP/old" install
          fetch gbdev/rgbds "$RUNNER_TEMP/rgbds-modern" f7b8207322aa9e3714ef0d98d01989f320103026
          make -C "$RUNNER_TEMP/rgbds-modern" -j2 PREFIX="$RUNNER_TEMP/modern" install
          fetch pret/pokered "$RUNNER_TEMP/originals" 0dbf95cd12f5b1511c62ce69efe283000f780a8f
          make -C "$RUNNER_TEMP/originals" -j2 RGBDS="$RUNNER_TEMP/modern/bin/" red blue
          fetch Alcaro/Flips "$RUNNER_TEMP/flips" ff216a75df0987047a67d7923567dc4482ce07ac
          make -C "$RUNNER_TEMP/flips" -j2 TARGET=cli
      - name: Build custom ROMs and test patches
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/old/bin:$PATH"
          make -j2 red blue
          python3 tools/package_bps.py --originals "$RUNNER_TEMP/originals" --output "$RUNNER_TEMP/patches" --flips "$RUNNER_TEMP/flips/flips"
      - name: Test species, moves and battle mechanics in PyBoy
        run: |
          python3 -m pip install pyboy==2.9.0 Pillow==11.3.0
          python3 tools/test_unique_species.py
          python3 tools/test_critical_hits.py
          python3 tools/test_freeze.py
          python3 tools/test_move_patch_1.py
          python3 tools/test_move_patch_2.py
          python3 tools/test_move_patch_3.py
          python3 tools/test_move_patch_4.py
          python3 tools/test_move_patch_5.py
          python3 tools/test_move_patch_6.py
          python3 tools/test_move_patch_7.py
          python3 tools/test_move_patch_8.py
          python3 tools/test_tm_distribution.py
          python3 tools/test_new_tms.py
          python3 tools/test_backs_and_species.py
          python3 tools/test_moonlight.py
          python3 tools/test_wake_up_slap.py
          python3 tools/test_quiver_dance.py
          python3 tools/test_zap_and_triple.py
          python3 tools/test_mud_and_shell.py
          python3 tools/test_electro_ball.py
          python3 tools/test_vine_crush.py
          python3 tools/test_crunch.py
          python3 tools/test_outrage.py
      - name: Upload patches and Windows guide only
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-183-species-bps
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/patches/*.bps
            ${{ runner.temp }}/patches/CHECKSUMS.txt
            ${{ runner.temp }}/patches/WINDOWS-PATCHING.md
            ${{ runner.temp }}/patches/UNIQUE-SPECIES.md
            ${{ runner.temp }}/patches/MOVE-PATCH-1.md
            ${{ runner.temp }}/patches/MOVE-PATCH-2.md
            ${{ runner.temp }}/patches/MOVE-PATCH-2-PLAN.md
            ${{ runner.temp }}/patches/MOVE-PATCH-3.md
            ${{ runner.temp }}/patches/MOVE-PATCH-4.md
            ${{ runner.temp }}/patches/MOVE-PATCH-5.md
            ${{ runner.temp }}/patches/MOVE-PATCH-6.md
            ${{ runner.temp }}/patches/MOVE-PATCH-7.md
            ${{ runner.temp }}/patches/MOVE-PATCH-8.md
            ${{ runner.temp }}/patches/TM-DISTRIBUTION.md
            ${{ runner.temp }}/patches/NEW-TMS.md
            ${{ runner.temp }}/patches/BACKSPRITES-AND-NEW-SPECIES.md
            ${{ runner.temp }}/patches/SEVEN-MORE-SPECIES.md
            ${{ runner.temp }}/patches/TYPE-CHANGES.md
            ${{ runner.temp }}/patches/SPECIES-TUNING-1.md
            ${{ runner.temp }}/patches/STARTER-REDESIGNS.md
            ${{ runner.temp }}/patches/EARLY-BUGS-AND-BIRDS.md
            ${{ runner.temp }}/patches/RATTATA-FEAROW-RAICHU.md
            ${{ runner.temp }}/patches/SANDSHREW-AND-NIDOS.md
            ${{ runner.temp }}/patches/CLEFAIRY-AND-VULPIX.md
            ${{ runner.temp }}/patches/PUFF-BATS-AND-FLOWERS.md
            ${{ runner.temp }}/patches/PARAS-VENONAT-DIGLETT.md
            ${{ runner.temp }}/patches/MEOWTH-PSYDUCK-MANKEY.md
            ${{ runner.temp }}/patches/GROWLITHE-POLIWAG-ABRA.md
            ${{ runner.temp }}/patches/MACHOP-BELLSPROUT-TENTACOOL.md
            ${{ runner.temp }}/patches/GOLEM-RAPIDASH-SLOWBRO.md
            ${{ runner.temp }}/patches/MAGNETS-DODRIO-DEWGONG.md
            ${{ runner.temp }}/patches/MUK-CLOYSTER-GENGAR.md
            ${{ runner.temp }}/patches/HYPNO-KINGLER-ELECTRODE.md
            ${{ runner.temp }}/patches/EXEGGUTOR-MAROWAK-HITMONS.md
            ${{ runner.temp }}/patches/LICKITUNG-WEEZING-RHYDON.md
            ${{ runner.temp }}/patches/CHANSEY-TANGELA-KANGASKHAN-SEADRA.md
