            ${{ runner.temp }}/patches/SCYTHER-JYNX-ELECTABUZZ-MAGMAR.md
            ${{ runner.temp }}/patches/PINSIR-TAUROS-GYARADOS.md
            ${{ runner.temp }}/patches/LAPRAS-DITTO-EEVEE-FAMILY.md
