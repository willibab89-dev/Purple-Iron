sive before later alternatives. “Before Champion” describes a species individually, not completion of every choice simultaneously. Fixed encounters listed here are capturable; the Pokémon Tower ghost Marowak is excluded. Route rates include the shared ordinary-rare and unique-species replacement pools.\n";document.querySelector('#notes').textContent=notes;function el(t,text){const x=document.createElement(t);x.textContent=text;return x}function render(){const q=document.querySelector('#q').value.toLowerCase(),s=document.querySelector('#status').value,v=document.querySelector('#version').value;const items=rows.map(r=>v?{...r,...r.by_version[v]}:r).filter(r=>(!s||r.status===s)&&(!v||r[v.toLowerCase()]!=='No player acquisition found')&&[r.dex,r.name,r.status,r.land,r.surf,r.fishing,r.other,r.evolution,r.postgame_safari,r.trainer_only].join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=items.length+' / 183 species';const b=document.querySelector('#body');b.replaceChildren();for(const r of items){const tr=document.createElement('tr');tr.append(el('td',String(r.dex).padStart(3,'0')+' — '+r.name));const st=el('td',r.status);st.className=r.status==='Trainer-only'?'tag':'';st.append(el('p','Red: '+r.red+' · Blue: '+r.blue));tr.append(st);const td=document.createElement('td');for(const [key,label] of [['land','Grass/cave'],['surf','Surf'],['fishing','Fishing'],['other','Gift/trade/prize/static'],['evolution','Evolution'],['postgame_safari','Extra post-Champion Safari access'],['trainer_only','Trainer appearances']]){if(!r[key])continue;const det=document.createElement('details');det.open=key==='evolution'||r.status==='Trainer-only';det.append(el('summary',label));det.append(el('p',r[key]));td.append(det)}tr.append(td);b.append(tr)}}for(const id of ['q','status','version'])document.getElementById(id).addEventListener('input',render);render();</script>
